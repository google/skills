// Proto definitions for the Gemini Enterprise Agent Platform Live API wire
// protocol (`LlmBidiService/BidiGenerateContent`), derived from the public
// documentation:
//   - https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/models/live-api
//   - https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/rpc/google.cloud.aiplatform.v1
//
// Always serialize and parse WebSocket frames as UTF-8 JSON text (e.g.,
// `google.protobuf.json_format.MessageToJson` and
// `Parse(..., ignore_unknown_fields=True)` in Python), never as binary protobuf
// bytes. Field numbers below are sequential local identifiers; only JSON field
// names and enum names appear on the WebSocket wire.

syntax = "proto3";

package google.ai.live.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";

option java_multiple_files = true;

// =============================================================================
// Top-level envelopes
// =============================================================================

// Client -> server WebSocket frame (`BidiGenerateContentClientMessage`).
// Exactly one field in `message_type` must be set per frame.
message ClientMessage {
  oneof message_type {
    // First frame only. Configures the session.
    BidiGenerateContentSetup setup = 1;

    // Turn-based, history-bearing input. Interrupts ongoing model generation.
    BidiGenerateContentClientContent client_content = 2;

    // Continuous, low-latency audio/video/text input.
    BidiGenerateContentRealtimeInput realtime_input = 3;

    // Reply to a server-issued `tool_call`.
    BidiGenerateContentToolResponse tool_response = 4;

    // Mid-session update to `system_instruction` or `tools`
    // (`gemini-3.8-live`).
    BidiGenerateContentContextUpdate context_update = 5;
  }
}

// Server -> client WebSocket frame (`BidiGenerateContentServerMessage`).
message ServerMessage {
  oneof message_type {
    // Sent once after `setup` is accepted. Gate all subsequent sends on this.
    BidiGenerateContentSetupComplete setup_complete = 1;

    // Streamed model output (audio/text), transcriptions, turn lifecycle.
    BidiGenerateContentServerContent server_content = 2;

    // Model is requesting tool execution.
    BidiGenerateContentToolCall tool_call = 3;

    // Cancels previously issued tool calls (e.g., on user barge-in).
    BidiGenerateContentToolCallCancellation tool_call_cancellation = 4;

    // Connection will be terminated soon (typically ~60s warning).
    GoAway go_away = 5;

    // Checkpoint handle for transparent session resumption.
    SessionResumptionUpdate session_resumption_update = 6;

    // Server-side VAD signal emitted when `setup.explicit_vad_signal = true`.
    VoiceActivity voice_activity = 7;
  }

  // Token usage accounting for the session / turn.
  UsageMetadata usage_metadata = 8;
}

// =============================================================================
// Common content & tool primitives
// =============================================================================

// Inline binary media payload (audio chunk, image frame, etc.).
message Blob {
  // IANA MIME type, e.g., "audio/pcm;rate=16000" or "image/jpeg".
  string mime_type = 1;

  // Raw bytes (base64-encoded on the JSON wire).
  bytes data = 2;

  // Optional display name for the blob.
  string display_name = 3;
}

// Reference to a remote file (e.g., Cloud Storage `gs://` URI).
message FileData {
  string mime_type = 1;
  string file_uri = 2;
  string display_name = 3;
}

// Code generated by the model when the `code_execution` tool is enabled.
message ExecutableCode {
  enum Language {
    LANGUAGE_UNSPECIFIED = 0;
    PYTHON = 1;
  }

  Language language = 1;
  string code = 2;
  optional string id = 3;
}

// Output of server-side execution of `ExecutableCode`.
message CodeExecutionResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_OK = 1;
    OUTCOME_FAILED = 2;
    OUTCOME_DEADLINE_EXCEEDED = 3;
  }

  Outcome outcome = 1;
  string output = 2;
  optional string id = 3;
}

// A function call requested by the model.
message FunctionCall {
  // Unique call ID; echo in the matching `FunctionResponse.id`.
  string id = 1;
  string name = 2;
  google.protobuf.Struct args = 3;
}

// Media payload carried inside a multimodal `FunctionResponse`.
message FunctionResponseBlob {
  string mime_type = 1;
  bytes data = 2;
  string display_name = 3;
}

// URI reference carried inside a multimodal `FunctionResponse`.
message FunctionResponseFileData {
  string mime_type = 1;
  string file_uri = 2;
  string display_name = 3;
}

// Multimodal part inside `FunctionResponse.parts`.
message FunctionResponsePart {
  oneof data {
    FunctionResponseBlob inline_data = 1;
    FunctionResponseFileData file_data = 2;
  }
}

// Result of executing a `FunctionCall`.
message FunctionResponse {
  // Controls how a `NON_BLOCKING` function response is scheduled into the turn.
  enum Scheduling {
    SCHEDULING_UNSPECIFIED = 0;
    // Add result to context only; do not interrupt or trigger generation.
    SILENT = 1;
    // Wait until current generation/speech finishes, then generate a response.
    WHEN_IDLE = 2;
    // Interrupt ongoing model output and immediately generate a response.
    INTERRUPT = 3;
  }

  // Must match the originating `FunctionCall.id`.
  string id = 1;
  string name = 2;
  google.protobuf.Struct response = 3;
  repeated FunctionResponsePart parts = 4;

  // Only applicable to `NON_BLOCKING` function calls. Defaults to `WHEN_IDLE`.
  optional Scheduling scheduling = 5;
}

// Single content part within a `Content` turn.
message Part {
  oneof data {
    string text = 1;
    Blob inline_data = 2;
    FileData file_data = 3;
    FunctionCall function_call = 4;
    FunctionResponse function_response = 5;
    ExecutableCode executable_code = 6;
    CodeExecutionResult code_execution_result = 7;
  }

  // True if this part represents model thought/reasoning text.
  bool thought = 8;
  bytes thought_signature = 9;
}

// Conversation turn with role ("user" or "model") and ordered parts.
message Content {
  string role = 1;
  repeated Part parts = 2;
}

// Declaration of a client-executed function tool.
message FunctionDeclaration {
  enum Behavior {
    UNSPECIFIED = 0;
    // Pause conversation until `FunctionResponse` arrives (`gemini-3.8-live`).
    BLOCKING = 1;
    // Continue conversation asynchronously while tool runs (Live API default).
    NON_BLOCKING = 2;
  }

  string name = 1;
  string description = 2;

  // OpenAPI 3.0 Schema object (mutually exclusive with
  // `parameters_json_schema`).
  google.protobuf.Struct parameters = 3;

  // Standard JSON Schema object for parameters.
  google.protobuf.Value parameters_json_schema = 4;

  // OpenAPI 3.0 response Schema object (mutually exclusive with
  // `response_json_schema`).
  google.protobuf.Struct response = 5;

  // Standard JSON Schema object for response.
  google.protobuf.Value response_json_schema = 6;

  // Execution mode in `BidiGenerateContent` (`NON_BLOCKING` or `BLOCKING`).
  optional Behavior behavior = 7;
}

// Tool configuration entry. Set at most one tool type per `Tool` message.
// Note: Search tools (`google_search`) cannot be combined with
// `function_declarations` in Live API setup.
message Tool {
  message GoogleSearch {
    repeated string exclude_domains = 1;
  }

  message CodeExecution {}

  message UrlContext {}

  repeated FunctionDeclaration function_declarations = 1;

  // Retrieval config (e.g., Vertex RAG Store on `v1beta1`).
  google.protobuf.Struct retrieval = 2;
  GoogleSearch google_search = 3;
  google.protobuf.Struct google_maps = 4;
  google.protobuf.Struct enterprise_web_search = 5;
  CodeExecution code_execution = 6;
  UrlContext url_context = 7;
}

// =============================================================================
// Safety settings
// =============================================================================

enum HarmCategory {
  HARM_CATEGORY_UNSPECIFIED = 0;
  HARM_CATEGORY_HATE_SPEECH = 1;
  HARM_CATEGORY_DANGEROUS_CONTENT = 2;
  HARM_CATEGORY_HARASSMENT = 3;
  HARM_CATEGORY_SEXUALLY_EXPLICIT = 4;
  HARM_CATEGORY_CIVIC_INTEGRITY = 5 [deprecated = true];
  HARM_CATEGORY_IMAGE_HATE = 6;
  HARM_CATEGORY_IMAGE_DANGEROUS_CONTENT = 7;
  HARM_CATEGORY_IMAGE_HARASSMENT = 8;
  HARM_CATEGORY_IMAGE_SEXUALLY_EXPLICIT = 9;
  HARM_CATEGORY_JAILBREAK = 10;
}

message SafetySetting {
  enum HarmBlockThreshold {
    HARM_BLOCK_THRESHOLD_UNSPECIFIED = 0;
    BLOCK_LOW_AND_ABOVE = 1;
    BLOCK_MEDIUM_AND_ABOVE = 2;
    BLOCK_ONLY_HIGH = 3;
    BLOCK_NONE = 4;
    OFF = 5;
  }

  enum HarmBlockMethod {
    HARM_BLOCK_METHOD_UNSPECIFIED = 0;
    SEVERITY = 1;
    PROBABILITY = 2;
  }

  HarmCategory category = 1;
  HarmBlockThreshold threshold = 2;
  HarmBlockMethod method = 3;
}

// =============================================================================
// Session setup (`BidiGenerateContentSetup`)
// =============================================================================

message BidiGenerateContentSetup {
  // Required. Format:
  // "projects/{project}/locations/{location}/publishers/google/models/{model}"
  string model = 1;

  GenerationConfig generation_config = 2;

  // Developer / system instructions (text parts only).
  Content system_instruction = 3;

  repeated Tool tools = 4;

  SessionResumptionConfig session_resumption = 5;

  ContextWindowCompressionConfig context_window_compression = 6;

  RealtimeInputConfig realtime_input_config = 7;

  AudioTranscriptionConfig input_audio_transcription = 8;

  AudioTranscriptionConfig output_audio_transcription = 9;

  // If true, server emits top-level `voice_activity` frames on VAD transitions.
  bool explicit_vad_signal = 10;

  // Proactive audio configuration (always on in `gemini-3.8-live`; opt-in on
  // `gemini-live-2.5-flash-native-audio`).
  ProactivityConfig proactivity = 11;

  // Conversation history configuration (set
  // `initial_history_in_client_content = true` when seeding prior turns).
  HistoryConfig history_config = 12;

  repeated SafetySetting safety_settings = 13;

  // User-defined billing/reporting labels.
  map<string, string> labels = 14;
}

message GenerationConfig {
  enum Modality {
    MODALITY_UNSPECIFIED = 0;
    TEXT = 1;
    IMAGE = 2;
    AUDIO = 3;
    VIDEO = 4;
  }

  enum MediaResolution {
    MEDIA_RESOLUTION_UNSPECIFIED = 0;
    MEDIA_RESOLUTION_LOW = 1;
    MEDIA_RESOLUTION_MEDIUM = 2;
    MEDIA_RESOLUTION_HIGH = 3;
  }

  optional float temperature = 1;
  optional float top_p = 2;
  optional float top_k = 3;
  optional int32 candidate_count = 4;
  optional int32 max_output_tokens = 5;
  optional float presence_penalty = 6;
  optional float frequency_penalty = 7;
  optional int32 seed = 8;

  // Response modality for the session: typically `[AUDIO]` (default) or
  // `[TEXT]`.
  repeated Modality response_modalities = 9;

  optional MediaResolution media_resolution = 10;

  optional SpeechConfig speech_config = 11;

  reserved 12;

  // Enables emotion-aware responses (always on in `gemini-3.8-live`; opt-in on
  // `gemini-live-2.5-flash-native-audio`).
  optional bool enable_affective_dialog = 13;
}

message SpeechConfig {
  // Single-speaker voice configuration (Live API is single-speaker only).
  VoiceConfig voice_config = 1;

  // BCP-47 language code (e.g., "en-US", "en-IN").
  string language_code = 2;
}

message VoiceConfig {
  oneof voice_config {
    PrebuiltVoiceConfig prebuilt_voice_config = 1;
  }
}

message PrebuiltVoiceConfig {
  // Case-sensitive prebuilt voice name (e.g., "Aoede", "Puck", "Charon").
  string voice_name = 1;
}

message ProactivityConfig {
  optional bool proactive_audio = 1;
}

message HistoryConfig {
  // Must be set to `true` in `gemini-3.8-live` when seeding prior conversation
  // history via `client_content`.
  bool initial_history_in_client_content = 1;
}

message AudioTranscriptionConfig {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    VERBATIM = 1;
    SMART = 2;
  }

  // Optional BCP-47 language hints; omit for automatic language detection.
  repeated string language_codes = 1;

  // Domain-specific terms/phrases (up to 1,000) to bias speech recognition.
  repeated string custom_vocabulary = 2;

  // Transcription mode (`VERBATIM` default or `SMART` cleanup).
  Mode mode = 3;
}

message SessionResumptionConfig {
  // Previous session handle from `SessionResumptionUpdate.new_handle`.
  optional string handle = 1;

  // Enables `last_consumed_client_message_index` in resumption updates.
  bool transparent = 2;
}

message ContextWindowCompressionConfig {
  message SlidingWindow {
    optional int64 target_tokens = 1;
  }

  optional int64 trigger_tokens = 1;

  oneof compression_mechanism {
    SlidingWindow sliding_window = 2;
  }
}

message RealtimeInputConfig {
  enum ActivityHandling {
    ACTIVITY_HANDLING_UNSPECIFIED = 0;
    START_OF_ACTIVITY_INTERRUPTS = 1;
    NO_INTERRUPTION = 2;
  }

  enum TurnCoverage {
    TURN_COVERAGE_UNSPECIFIED = 0;
    TURN_INCLUDES_ONLY_ACTIVITY = 1;
    TURN_INCLUDES_ALL_INPUT = 2;
  }

  message AutomaticActivityDetection {
    enum StartSensitivity {
      START_SENSITIVITY_UNSPECIFIED = 0;
      START_SENSITIVITY_HIGH = 1;
      START_SENSITIVITY_LOW = 2;
    }

    enum EndSensitivity {
      END_SENSITIVITY_UNSPECIFIED = 0;
      END_SENSITIVITY_HIGH = 1;
      END_SENSITIVITY_LOW = 2;
    }

    optional bool disabled = 1;
    StartSensitivity start_of_speech_sensitivity = 2;
    EndSensitivity end_of_speech_sensitivity = 3;
    int32 prefix_padding_ms = 4;
    int32 silence_duration_ms = 5;
  }

  AutomaticActivityDetection automatic_activity_detection = 1;
  optional ActivityHandling activity_handling = 2;
  optional TurnCoverage turn_coverage = 3;
}

// =============================================================================
// Post-setup client messages
// =============================================================================

message BidiGenerateContentClientContent {
  repeated Content turns = 1;
  bool turn_complete = 2;
}

message BidiGenerateContentRealtimeInput {
  message ActivityStart {}
  message ActivityEnd {}

  // Deprecated: prefer typed `audio`, `video`, or `text` fields below.
  repeated Blob media_chunks = 1 [deprecated = true];

  // Realtime audio stream (`audio/pcm;rate=16000`, 16-bit signed mono PCM).
  Blob audio = 2;

  // Realtime video/screen frame (`image/jpeg`, `image/png`, or `image/webp`).
  Blob video = 3;

  // Manual VAD markers (only valid when `automatic_activity_detection.disabled`
  // is `true`).
  ActivityStart activity_start = 4;
  ActivityEnd activity_end = 5;

  // Signals microphone turned off (only valid when auto-VAD is enabled).
  optional bool audio_stream_end = 6;

  // Realtime text input.
  optional string text = 7;
}

message BidiGenerateContentToolResponse {
  repeated FunctionResponse function_responses = 1;
}

// Mid-session update to `system_instruction` and/or `tools`.
message BidiGenerateContentContextUpdate {
  // Wrapper distinguishing "leave tools unchanged" (unset) from "clear all
  // tools" (`tools: {}` / empty list).
  message Tools {
    repeated Tool tools = 1;
  }

  Tools tools = 1;
  Content system_instruction = 2;
}

// =============================================================================
// Server messages
// =============================================================================

message BidiGenerateContentSetupComplete {
  optional string session_id = 1;
}

message BidiGenerateContentServerContent {
  message Transcription {
    string text = 1;
    bool finished = 2;
  }

  enum TurnCompleteReason {
    TURN_COMPLETE_REASON_UNSPECIFIED = 0;
    MALFORMED_FUNCTION_CALL = 1;
    RESPONSE_REJECTED = 2;
    NEED_MORE_INPUT = 3;
    PROHIBITED_INPUT_CONTENT = 4;
    IMAGE_PROHIBITED_INPUT_CONTENT = 5;
    INPUT_TEXT_CONTAIN_PROMINENT_PERSON_PROHIBITED = 6;
    INPUT_IMAGE_CELEBRITY = 7;
    INPUT_IMAGE_PHOTO_REALISTIC_CHILD_PROHIBITED = 8;
    INPUT_TEXT_NCII_PROHIBITED = 9;
    INPUT_OTHER = 10;
    INPUT_IP_PROHIBITED = 11;
    BLOCKLIST = 12;
    UNSAFE_PROMPT_FOR_IMAGE_GENERATION = 13;
    GENERATED_IMAGE_SAFETY = 14;
    GENERATED_CONTENT_SAFETY = 15;
    GENERATED_AUDIO_SAFETY = 16;
    GENERATED_VIDEO_SAFETY = 17;
    GENERATED_CONTENT_PROHIBITED = 18;
    GENERATED_CONTENT_BLOCKLIST = 19;
    GENERATED_IMAGE_PROHIBITED = 20;
    GENERATED_IMAGE_CELEBRITY = 21;
    GENERATED_IMAGE_PROMINENT_PEOPLE_DETECTED_BY_REWRITER = 22;
    GENERATED_IMAGE_IDENTIFIABLE_PEOPLE = 23;
    GENERATED_IMAGE_MINORS = 24;
    OUTPUT_IMAGE_IP_PROHIBITED = 25;
    GENERATED_OTHER = 26;
    MAX_REGENERATION_REACHED = 27;
  }

  enum SpeechState {
    SPEECH_STATE_UNSPECIFIED = 0;
    NON_SPEECH = 1;
    SPEECH = 2;
  }

  enum InteractionStatus {
    INTERACTION_STATUS_UNSPECIFIED = 0;
    IN_PROGRESS = 1;
    REQUIRES_ACTION = 2 [deprecated = true];
    IDLE = 3;
  }

  optional Content model_turn = 1;
  bool turn_complete = 2;
  bool interrupted = 3;
  bool generation_complete = 4;
  google.protobuf.Struct grounding_metadata = 5;
  Transcription input_transcription = 6;
  Transcription output_transcription = 7;
  TurnCompleteReason turn_complete_reason = 8;
  SpeechState speech_state = 9;
  Transcription interim_input_transcription = 10;
  InteractionStatus interaction_status = 11;
}

message BidiGenerateContentToolCall {
  repeated FunctionCall function_calls = 1;
}

message BidiGenerateContentToolCallCancellation {
  repeated string ids = 1;
}

// =============================================================================
// Lifecycle, VAD & token accounting
// =============================================================================

message GoAway {
  google.protobuf.Duration time_left = 1;
}

message SessionResumptionUpdate {
  string new_handle = 1;
  bool resumable = 2;
  int64 last_consumed_client_message_index = 3;
}

message VoiceActivity {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    ACTIVITY_START = 1;
    ACTIVITY_END = 2;
  }

  Type type = 1;
  google.protobuf.Duration audio_offset = 2;
}

enum Modality {
  MODALITY_UNSPECIFIED = 0;
  TEXT = 1;
  IMAGE = 2;
  VIDEO = 3;
  AUDIO = 4;
  DOCUMENT = 5;
}

message ModalityTokenCount {
  Modality modality = 1;
  int32 token_count = 2;
}

message UsageMetadata {
  enum TrafficType {
    TRAFFIC_TYPE_UNSPECIFIED = 0;
    ON_DEMAND = 1;
    ON_DEMAND_PRIORITY = 2;
    ON_DEMAND_FLEX = 3;
    PROVISIONED_THROUGHPUT = 4;
  }

  int32 prompt_token_count = 1;
  int32 candidates_token_count = 2;
  int32 total_token_count = 3;
  int32 tool_use_prompt_token_count = 4;
  int32 thoughts_token_count = 5;
  int32 cached_content_token_count = 6;
  repeated ModalityTokenCount prompt_tokens_details = 7;
  repeated ModalityTokenCount cache_tokens_details = 8;
  repeated ModalityTokenCount candidates_tokens_details = 9;
  repeated ModalityTokenCount tool_use_prompt_tokens_details = 10;
  TrafficType traffic_type = 11;
}
